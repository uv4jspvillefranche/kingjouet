        .month-title {

            padding: 15px;
            font-size: 1.8em;
            font-weight: bold;
            text-align: center;
            border-radius: 8px 8px 0 0;

             background: #ddd;

            font-weight: bold;

        .day-number {
            font-weight: bold;

            height: 56px;

        // Fonction pour parser les données CSV
        function parseCSVData(csvText) {
            const lines = csvText.trim().split('\n');
            const data = {};
            
            lines.forEach(line => {
                const [dateStr, timeStr, nameStr, uvStr] = line.split(';');
                
                // Extraire les informations
                const date = dateStr.trim();
                const time = timeStr.trim();
                const name = nameStr.trim();
                const uv = uvStr;
                
                // Initialiser la date si elle n'existe pas
                if (!data[date]) {
                    data[date] = [];
                }
                
                // Ajouter le créneau
                data[date].push({
                    time: time,
                    name: name,
                    uv: uv,
                    isEmpty: !name || name === ''
                });
            });
            
            return data;
        }

        // Fonction pour extraire le jour du mois à partir de la date française
        function extractDayFromFrenchDate(dateStr) {
            const match = dateStr.match(/(\d{1,2})\s+(octobre|novembre|décembre)\s+2026/i);
            if (match) {
                return parseInt(match[1]);
            }
            return null;
        }

        // Fonction pour obtenir le mois à partir de la date française
        function extractMonthFromFrenchDate(dateStr) {
            const match = dateStr.match(/(octobre|novembre|décembre)/i);
            if (match) {
                return match[1].toLowerCase();
            }
            return null;
        }

        // Fonction pour obtenir le jour de la semaine (0=dimanche, 1=lundi, etc.)
        function getDayOfWeek(dateStr) {
            const dayMap = {
                'dimanche': 0, 'lundi': 1, 'mardi': 2, 'mercredi': 3,
                'jeudi': 4, 'vendredi': 5, 'samedi': 6
            };
            const match = dateStr.match(/(dimanche|lundi|mardi|mercredi|jeudi|vendredi|samedi)/i);
            return match ? dayMap[match[1]] : null;
        }

        function getDateOfFirstMondayOfLastWeekOfOctober(currentYear) {
          // 1. On se positionne sur le 31 octobre à 23h59 ou directement sur le 31 octobre
          const d = new Date(currentYear, 9, 31); // Le mois 9 correspond à octobre (0 = janvier, 9 = octobre)
          
          // 2. On récupère le jour de la semaine (0 = dimanche, 1 = lundi, ..., 6 = samedi)
          let dayOfWeek = d.getDay();
          
          // 3. On calcule le décalage pour reculer jusqu'au lundi de cette semaine.
          // Si le 31 est un lundi (1), le décalage est de 0.
          // Si le 31 est un mardi (2), on recule de 1 jour.
          // Si le 31 est un dimanche (0), on recule de 6 jours.
          let shift = (dayOfWeek === 0) ? 6 : dayOfWeek - 1;
          
          // 4. On applique le décalage pour obtenir la date exacte du lundi
          d.setDate(d.getDate() - shift);
          
          // 5. On retourne le numéro du jour du mois (ex: 27, 28, etc.)
          return d.getDate();
        }

        function getDayIndexOfFirstdayGivenMonthAndYear(year, month) {
          // En JavaScript, les mois vont de 0 à 11 (0 = janvier, 11 = décembre).
          // On fait donc (month - 1) pour correspondre au paramètre classique (1 à 12).
          const d = new Date(year, month - 1, 1);
          
          const jsDay = d.getDay(); // 0 = Dimanche, 1 = Lundi, ..., 6 = Samedi
          
          // On décale pour que Lundi devienne 0 et Dimanche 6
          return (jsDay + 6) % 7;
        }

             * CHANGE CHAQUE ANNÉE
             */
            // si on est en septembre ou +, on a l'année courante, sinon entre janvier et aout on a l'année de l'année d'avant
            const currentYear = new Date().getMonth() >= 8 ? new Date().getFullYear() : new Date().getFullYear() - 1;

            // Insertion de l'année dans le bandeau de titre
            document.getElementById("year").textContent = currentYear;

            /*
             * CHANGE CHAQUE ANNÉE
             */
            const monthNames = {
                'octobre': 'Octobre ' + currentYear,
                'novembre': 'Novembre ' + currentYear,
                'décembre': 'Décembre ' + currentYear
            };
            
            const daysInMonth = {
                'octobre': 31,
                'novembre': 30,
                'décembre': 31
            };

            /*
             * CHANGE CHAQUE ANNÉE, lundi = 0 - dimanche = 6
             */
            const firstDayOfMonth = {
                'octobre': 0, // C'est toujours un lundi (position 0 dans le calendrier français)
                'novembre': getDayIndexOfFirstdayGivenMonthAndYear(currentYear, 11), // 1er novembre 2026 est un dimanche (position 6 dans le calendrier français)
                'décembre': getDayIndexOfFirstdayGivenMonthAndYear(currentYear, 12)  // 1er décembre 2026 est un mardi (position 1 dans le calendrier français)
            };
            
            /*
             * CHANGE CHAQUE ANNÉE, le numéro du 1er jour du mois d'octobre à afficher (e.g. 26 en 2026 car on veut le lundi 26 octobre)
             */
            const firstDayOfOctober = getDateOfFirstMondayOfLastWeekOfOctober(currentYear);
            
            const dayHeaders = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
            
            months.forEach(month => {
                const monthDiv = document.createElement('div');
                monthDiv.className = 'month';
                
                // Titre du mois
                const titleDiv = document.createElement('div');
                titleDiv.className = 'month-title';
                titleDiv.textContent = monthNames[month];
                monthDiv.appendChild(titleDiv);
                
                // Grille du calendrier
                const gridDiv = document.createElement('div');
                gridDiv.className = 'calendar-grid';
                
                // En-têtes des jours
                dayHeaders.forEach(day => {
                    const headerDiv = document.createElement('div');
                    headerDiv.className = 'day-header';
                    headerDiv.textContent = day;
                    gridDiv.appendChild(headerDiv);
                });
                
                // Cellules vides pour le début du mois
                for (let i = 0; i < firstDayOfMonth[month]; i++) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'day-cell empty-day';
                    emptyDiv.textContent = '';
                    gridDiv.appendChild(emptyDiv);
                }
                
                // Cellules des jours du mois
                const startDay = month === 'octobre' ? firstDayOfOctober : 1;
                const endDay = month === 'octobre' ? 31 : (month === 'décembre' ? 28 : daysInMonth[month]);
                for (let day = startDay; day <= endDay; day++) {
                    const dayDiv = document.createElement('div');
                    dayDiv.className = 'day-cell';
                    
                    const dayNumberDiv = document.createElement('div');
                    dayNumberDiv.className = 'day-number';
                    dayNumberDiv.textContent = day;
                    dayDiv.appendChild(dayNumberDiv);
                    
                     // Trouver les créneaux pour ce jour
                     const slotsForDay = [];
                     Object.keys(data).forEach(dateKey => {
                         if (extractMonthFromFrenchDate(dateKey) === month && 
                             extractDayFromFrenchDate(dateKey) === day) {
                             slotsForDay.push(...data[dateKey]);
                         }
                     });
                     
                     // Grouper les créneaux par horaire
                     const groupedSlots = {};
                     slotsForDay.forEach(slot => {
                         if (!groupedSlots[slot.time]) {
                             groupedSlots[slot.time] = [];
                         }
                         groupedSlots[slot.time].push(slot);
                     });
                     
                     // Ajouter les créneaux groupés
                     Object.keys(groupedSlots).forEach(time => {
                         const slots = groupedSlots[time];
                         const assignedSlots = slots.filter(slot => !slot.isEmpty);
                         const emptySlots = slots.filter(slot => slot.isEmpty);
                         
                         // Si il y a des créneaux assignés ET des créneaux vides, les séparer
                         if (assignedSlots.length > 0 && emptySlots.length > 0) {
                             // Afficher d'abord le créneau assigné (fusionné)
                             if (assignedSlots.length > 0) {
                                 const slotDiv = document.createElement('div');
                                 slotDiv.className = 'time-slot assigned';
                                 
                                 const timeDiv = document.createElement('span');
                                 timeDiv.className = 'time-text';
                                 timeDiv.textContent = time;
                                 slotDiv.appendChild(timeDiv);
                                 
                                 assignedSlots.forEach(slot => {
                                     const nameDiv = document.createElement('div');
                                     nameDiv.className = 'name-text';
                                     nameDiv.innerHTML = `${slot.name} <span class="uv-text">(${slot.uv})</span>`;
                                     slotDiv.appendChild(nameDiv);
                                 });
                                 
                                 dayDiv.appendChild(slotDiv);
                             }
                             
                             // Puis afficher le(s) créneau(s) vide(s)
                             emptySlots.forEach(() => {
                                 const slotDiv = document.createElement('div');
                                 slotDiv.className = 'time-slot empty';
                                 
                                 const timeDiv = document.createElement('span');
                                 timeDiv.className = 'time-text';
                                 timeDiv.textContent = time;
                                 slotDiv.appendChild(timeDiv);
                                 
                                 const emptyDiv = document.createElement('div');
                                 emptyDiv.className = 'name-text';
                                 emptyDiv.textContent = 'Non assigné';
                                 slotDiv.appendChild(emptyDiv);
                                 
                                 dayDiv.appendChild(slotDiv);
                             });
                         } else {
                             // Cas normal : soit que des assignés, soit que des vides
                             const hasAssigned = assignedSlots.length > 0;
                             
                             const slotDiv = document.createElement('div');
                             slotDiv.className = `time-slot ${hasAssigned ? 'assigned' : 'empty'}`;
                             
                             const timeDiv = document.createElement('span');
                             timeDiv.className = 'time-text';
                             timeDiv.textContent = time;
                             slotDiv.appendChild(timeDiv);
                             
                             if (hasAssigned) {
                                 // Ajouter tous les noms assignés pour cet horaire
                                 assignedSlots.forEach(slot => {
                                     const nameDiv = document.createElement('div');
                                     nameDiv.className = 'name-text';
                                     nameDiv.innerHTML = `${slot.name} <span class="uv-text">(${slot.uv})</span>`;
                                     slotDiv.appendChild(nameDiv);
                                 });
                             } else {
                                 // Afficher "Non assigné" pour chaque créneau vide
                                 emptySlots.forEach(() => {
                                     const emptyDiv = document.createElement('div');
                                     emptyDiv.className = 'name-text';
                                     emptyDiv.textContent = 'Non assigné';
                                     slotDiv.appendChild(emptyDiv);
                                 });
                             }
                             
                             dayDiv.appendChild(slotDiv);
                         }
                     });
                    
                    gridDiv.appendChild(dayDiv);
                }
                
                monthDiv.appendChild(gridDiv);
                container.appendChild(monthDiv);
            });
        }

        // Générer le calendrier au chargement de la page
        document.addEventListener('DOMContentLoaded', generateCalendar);
    </script>
</body>
</html>
